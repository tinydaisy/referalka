name: Сборка

# Собираем ФРОНТ у GitHub, а не на сервере. Раньше сборка шла прямо на проде
# поверх работающей .next: Next.js читал папку, которую в этот момент
# переписывали, — отсюда ошибки у клиентов и «сайт лёг на 5-10 минут».
# Теперь прод во время сборки вообще не участвует.
#
# Сломанный код до прода не доедет: сборка упадёт здесь.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # можно запустить вручную кнопкой

concurrency:
  # Новый пуш отменяет предыдущую сборку той же ветки — незачем собирать
  # то, что уже устарело, и жечь минуты.
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ⚠️⚠️ БЕЗ ЭТОГО РЕЛИЗ НЕ СОЗДАСТСЯ. По умолчанию GITHUB_TOKEN даёт только
# чтение, и `gh release create` отвечает отказом доступа — сборка снова станет
# красной, теперь уже по другой причине.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Веб-кабинет ────────────────────────────────────────────────────
      - name: Ставим зависимости web
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Собираем web
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          # ⚠️ ОБЯЗАТЕЛЬНО: адреса подставляются в код В МОМЕНТ СБОРКИ. Без них
          # фронт уходит на запасной localhost:8000 — браузер стучится сам в
          # себя, и человек видит «Сервер недоступен» на экране входа.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STORAGE_URL: ${{ vars.NEXT_PUBLIC_STORAGE_URL }}
        run: npm run build

      # ── Mini App: четыре площадки ──────────────────────────────────────
      # ⚠️ Собирать ВСЕ четыре обязательно: исходник общий (mini-app/src),
      # и если пересобрать не все, площадки разъедутся — так «Подробнее» у
      # регалий уже появлялось в TG и вебе, но не в VK и MAX.
      - name: Ставим зависимости mini-app
        working-directory: mini-app
        run: npm ci --no-audit --no-fund

      - name: Собираем mini-app (tg, vk, max, web)
        working-directory: mini-app
        env:
          # ⚠️⚠️ ОБЯЗАТЕЛЬНО, ровно как у web выше. Адрес подставляется в код В
          # МОМЕНТ СБОРКИ; без него Mini App уходит на запасной localhost:8000 —
          # приложение стучится САМО В СЕБЯ вместо сервера, и человек видит
          # пустые вкладки: ни событий, ни «О проекте», ни подарков.
          # Так и легли ВСЕ ЧЕТЫРЕ площадки на проде 24.08 — переменную завели
          # только для web, а для mini-app забыли.
          VITE_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # ── Пакуем то, что реально нужно серверу ───────────────────────────
      # ⚠️ .next/cache НЕ берём: это кеш сборки (350+ МБ), для работы сайта
      # не нужен. Итоговый архив — десятки мегабайт, а не гигабайты.

      # ⚠️⚠️ ЗАСЛОН: не выпускаем сборку, в которой адрес сервера не подставился.
      # 24.08 Mini App уехал на прод с запасным localhost:8000 — приложение
      # стучалось само в себя, и ВСЕ ЧЕТЫРЕ площадки показывали пустые вкладки.
      # Заметили только по жалобе клиентов. Теперь сборка падает здесь.
      - name: Проверяем, что адрес сервера попал в сборку
        run: |
          set -e
          BAD=0
          # ⚠️ Только то, что скачивает БРАУЗЕР. В web/.next/server есть
          # служебный файл, где localhost:8000 законен: сервер обращается к
          # бэкенду на той же машине. Проверять его — ложная тревога.
          for d in web/.next/static mini-app/dist mini-app/dist-vk mini-app/dist-max mini-app/dist-web; do
            [ -d "$d" ] || continue
            if grep -rqs 'localhost:8000' "$d" 2>/dev/null; then
              echo "✗ $d собран с localhost:8000 — адрес сервера не подставился"
              BAD=1
            else
              echo "✓ $d"
            fi
          done
          if [ "$BAD" = "1" ]; then
            echo ""
            echo "Проверьте переменную NEXT_PUBLIC_API_URL в настройках репозитория"
            echo "(Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Пакуем артефакт
        run: |
          set -e
          mkdir -p out/web/.next out/mini-app
          cp -r web/.next/server web/.next/static out/web/.next/
          cp web/.next/BUILD_ID out/web/.next/
          for f in web/.next/*.json web/.next/*.js; do
            [ -f "$f" ] && cp "$f" out/web/.next/ || true
          done
          cp -r mini-app/dist mini-app/dist-vk mini-app/dist-max mini-app/dist-web out/mini-app/
          echo "${{ github.sha }}" > out/COMMIT
          tar -czf build.tar.gz -C out .
          ls -lh build.tar.gz

      # ⚠️⚠️ ДВА ПУТИ ДОСТАВКИ, и релиз — ОСНОВНОЙ (14.09.2026).
      #
      # Артефакты живут в хранилище с общей на учётку квотой 500 МБ. Она
      # кончилась, и сборка встала НАСМЕРТЬ: все шаги зелёные, падает только
      # загрузка — «Artifact storage quota has been hit, usage is recalculated
      # every 6-12 hours». Место освободили сразу (70 МБ из 500), а счётчик
      # GitHub пересчитывает сам, и выкатить было нечего ПОЛДНЯ.
      #
      # Релизы в эту квоту НЕ входят. Поэтому сборка едет релизом, а артефакт
      # остаётся запасным путём и больше никогда не роняет прогон целиком
      # (continue-on-error). deploygit умеет забрать и оттуда, и оттуда.
      - name: Кладём сборку в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${GITHUB_SHA::8}"
          # Тег на коммит сборки: по нему deploygit находит нужную версию.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build.tar.gz \
            --title "Сборка ${GITHUB_SHA::8}" \
            --notes "Автоматическая сборка. Накат: deploygit" \
            --target "$GITHUB_SHA"
          echo "✓ Сборка в релизе $TAG"

      # ⚠️ Старые релизы сборок чистим тут же — иначе они копятся так же, как
      # копились артефакты. Держим 10 последних: хватает на откат назад.
      - name: Убираем старые релизы сборок
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r t; do
              [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
            done

      # ⚠️ Запасной путь. `continue-on-error` обязателен: без него упёршаяся
      # квота снова красит прогон в «failure», хотя сборка уже уехала релизом.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: build
          path: build.tar.gz
          retention-days: 7
