name: Выкатить на прод

# Собранное GitHub-ом едет на сервер и переключается там.
#
# ⚠️ Пуш в main выкатывается САМ — как было раньше, только безопаснее:
# сломанный код физически не доедет, потому что сборка упадёт здесь.
# Владельцу не нужно жать кнопку на каждую свою правку.
#
# ⚠️ Ветки, КРОМЕ main, не выкатываются. Так подрядчик работает в своей
# ветке и на прод попасть не может: вы смотрите его работу и вливаете в
# main, когда согласны. Контроль — на этапе слияния, а не кнопки.
#
# Кнопка тоже остаётся: Actions → «Выкатить на прод» → Run workflow.
# Нужна, чтобы выкатить повторно или отложить накат на ночь.

on:
  push:
    branches: [main]
    paths-ignore:            # правки только документации катить незачем
      - '**.md'
      - 'documentation/**'
      - 'other_tasks/**'
  workflow_dispatch:
    inputs:
      when:
        description: 'Когда выкатить'
        type: choice
        default: 'сейчас'
        options:
          - 'сейчас'
          - 'ночью в 04:00 МСК'

concurrency:
  # Два наката одновременно переключали бы папки друг у друга под ногами.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ставим зависимости web
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Собираем web
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          # ⚠️ ОБЯЗАТЕЛЬНО: адреса подставляются в код В МОМЕНТ СБОРКИ. Без них
          # фронт уходит на запасной localhost:8000 — браузер стучится сам в
          # себя, и человек видит «Сервер недоступен» на экране входа.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STORAGE_URL: ${{ vars.NEXT_PUBLIC_STORAGE_URL }}
        run: npm run build

      - name: Ставим зависимости mini-app
        working-directory: mini-app
        run: npm ci --no-audit --no-fund

      # ⚠️ Все четыре площадки: исходник общий, соберёшь не все — разъедутся.
      - name: Собираем mini-app (tg, vk, max, web)
        working-directory: mini-app
        env:
          # ⚠️⚠️ ОБЯЗАТЕЛЬНО, ровно как у web выше. Адрес подставляется в код В
          # МОМЕНТ СБОРКИ; без него Mini App уходит на запасной localhost:8000 —
          # приложение стучится САМО В СЕБЯ вместо сервера, и человек видит
          # пустые вкладки: ни событий, ни «О проекте», ни подарков.
          # Так и легли ВСЕ ЧЕТЫРЕ площадки на проде 24.08 — переменную завели
          # только для web, а для mini-app забыли.
          VITE_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build


      # ⚠️⚠️ ЗАСЛОН: не выпускаем сборку, в которой адрес сервера не подставился.
      # 24.08 Mini App уехал на прод с запасным localhost:8000 — приложение
      # стучалось само в себя, и ВСЕ ЧЕТЫРЕ площадки показывали пустые вкладки.
      # Заметили только по жалобе клиентов. Теперь сборка падает здесь.
      - name: Проверяем, что адрес сервера попал в сборку
        run: |
          set -e
          BAD=0
          for d in web/.next mini-app/dist mini-app/dist-vk mini-app/dist-max mini-app/dist-web; do
            [ -d "$d" ] || continue
            if grep -rqs 'localhost:8000' "$d" 2>/dev/null; then
              echo "✗ $d собран с localhost:8000 — адрес сервера не подставился"
              BAD=1
            else
              echo "✓ $d"
            fi
          done
          if [ "$BAD" = "1" ]; then
            echo ""
            echo "Проверьте переменную NEXT_PUBLIC_API_URL в настройках репозитория"
            echo "(Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Пакуем артефакт
        run: |
          set -e
          mkdir -p out/web/.next out/mini-app
          cp -r web/.next/server web/.next/static out/web/.next/
          cp web/.next/BUILD_ID out/web/.next/
          for f in web/.next/*.json web/.next/*.js; do
            [ -f "$f" ] && cp "$f" out/web/.next/ || true
          done
          cp -r mini-app/dist mini-app/dist-vk mini-app/dist-max mini-app/dist-web out/mini-app/
          echo "${{ github.sha }}" > out/COMMIT
          tar -czf build.tar.gz -C out .
          ls -lh build.tar.gz

      - name: Готовим доступ к серверу
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Отправляем сборку на сервер
        run: |
          scp -i ~/.ssh/id_ed25519 build.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/build.tar.gz"

      # ── Немедленный накат ──────────────────────────────────────────────
      - name: Выкатываем сейчас
        # При автоматическом пуше поля «когда» нет — катим сразу.
        if: inputs.when == 'сейчас' || inputs.when == ''
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /var/www/plusson/deploy/release.sh /tmp/build.tar.gz ${{ github.sha }}"

      # ── Отложенный накат ───────────────────────────────────────────────
      # GitHub не умеет ждать до ночи (машину на 12 часов не дадут), поэтому
      # сборка кладётся на сервер и ждёт там, а переключит её системный таймер.
      - name: Ставим накат на 04:00 МСК
        if: inputs.when == 'ночью в 04:00 МСК'
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /var/www/plusson/deploy/schedule_release.sh /tmp/build.tar.gz ${{ github.sha }}"
