<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Редактор спикеров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; background: linear-gradient(45deg, #25455D, #0a1520); min-height: 100vh; color: #1a2535; }

    .page-header {
      background: linear-gradient(45deg, #25455D, #0a1520);
      padding: 20px 16px 24px;
    }
    .header-top { max-width: 720px; margin: 0 auto 16px; display: flex; align-items: center; gap: 10px; }
    .logo-text { color: #FFCFA4; font-size: 18px; font-weight: 700; }
    .assistant-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .page-title { max-width: 720px; margin: 0 auto; }
    .page-title h1 { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .page-title p { color: rgba(255,255,255,0.55); font-size: 13px; }

    .content { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }

    /* Поиск */
    .search-box { position: relative; margin-bottom: 16px; }
    .search-input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.35); }
    .search-input:focus { border-color: rgba(255,207,164,0.5); background: rgba(255,255,255,0.1); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); }

    /* Список спикеров */
    .speakers-list { display: flex; flex-direction: column; gap: 10px; }

    .speaker-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .speaker-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
    }

    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #e8edf2;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { color: #a0aab4; font-size: 18px; font-weight: 700; }

    .sp-meta { flex: 1; min-width: 0; }
    .sp-name { font-weight: 700; font-size: 15px; color: #1a2535; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-role { font-size: 12px; color: #6b7a8d; margin-bottom: 5px; }
    .sp-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 500; }
    .badge-ok { background: #e8f5e9; color: #2e7d32; }
    .badge-warn { background: #fff8e1; color: #e65100; }

    .toggle-btn {
      width: 32px; height: 32px;
      border-radius: 10px;
      border: 1.5px solid #e2e6ea;
      background: white;
      color: #6b7a8d;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .toggle-btn:hover { border-color: #25455D; color: #25455D; }
    .toggle-btn.open { background: linear-gradient(45deg, #25455D, #0a1520); border-color: transparent; color: #FFCFA4; }

    /* Форма спикера */
    .speaker-form {
      border-top: 1px solid #f0f2f5;
      padding: 18px 16px 20px;
      display: none;
    }
    .speaker-form.visible { display: block; }

    .form-section-title {
      font-size: 12px;
      font-weight: 700;
      color: #25455D;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f0f2f5;
    }
    .form-section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #8896a7;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }
    .warn-dot { color: #e65100; }

    input[type=text], input[type=url], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e6ea;
      border-radius: 10px;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: #1a2535;
      background: #fafbfc;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #25455D; background: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Темы */
    .topics-list { display: flex; flex-direction: column; gap: 8px; }
    .topic-row { display: flex; gap: 6px; align-items: flex-start; }
    .topic-num {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: linear-gradient(45deg, #25455D, #0a1520);
      color: #FFCFA4;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 9px;
    }
    .btn-remove-topic {
      width: 26px; height: 26px;
      border-radius: 7px;
      border: 1px solid #e2e6ea;
      background: white;
      color: #aab4be;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 9px;
    }
    .btn-remove-topic:hover { color: #e74c3c; border-color: #e74c3c; }
    .btn-add-topic {
      background: none; border: none;
      color: #25455D; font-size: 12px; font-weight: 600;
      cursor: pointer; padding: 4px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-add-topic:hover { color: #FFCFA4; }

    /* Медиа — только просмотр */
    .media-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 4px; }
    .media-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .media-label-sm { font-size: 10px; color: #8896a7; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .thumb-click {
      border-radius: 10px; overflow: hidden; background: #e8edf2;
      cursor: pointer; position: relative;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-click:hover { transform: scale(1.05); box-shadow: 0 3px 12px rgba(0,0,0,0.18); }
    .thumb-photo { width: 56px; height: 56px; }
    .thumb-poster-v { width: 48px; height: 72px; }
    .thumb-click img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-empty-sm { color: #c0c8d0; font-size: 10px; text-align: center; padding: 6px 4px; }
    .zoom-icon { position: absolute; bottom: 3px; right: 3px; background: rgba(0,0,0,0.45); border-radius: 4px; padding: 1px 3px; font-size: 10px; color: white; opacity: 0; transition: opacity 0.15s; }
    .thumb-click:hover .zoom-icon { opacity: 1; }
    /* Лайтбокс */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; object-fit: contain; }
    .lightbox-close { position: fixed; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; opacity: 0.8; line-height: 1; }
    .lightbox-close:hover { opacity: 1; }

    /* Кнопка сохранить */
    .save-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .save-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #FFCFA4, #f5a65b);
      color: #1a2535;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.2s;
    }
    .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .save-btn:not(:disabled):hover { opacity: 0.9; }
    .saved-label { font-size: 13px; font-weight: 600; color: #2e7d32; display: none; }

    /* Spinner */
    .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,207,164,0.3);
      border-top-color: #FFCFA4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .btn-spinner { width: 18px; height: 18px; border: 2px solid rgba(26,37,53,0.3); border-top-color: #1a2535; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); border-radius: 14px; padding: 16px; color: #ffaaaa; font-size: 14px; text-align: center; }
    .hint { font-size: 12px; color: #a0aab4; margin-top: 4px; }
    .field-default-hint {
      font-size: 11px; color: #c0392b; font-style: italic;
      margin-top: 5px; padding: 7px 10px;
      background: #fff5f5; border-radius: 7px;
      border-left: 3px solid #e74c3c; line-height: 1.5;
    }
    .field-default-hint strong { font-weight: 600; color: #c0392b; font-style: normal; }

    .count-info { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 12px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="header-top">
    <span class="logo-text">iViSiON: ПЛЮСОН</span>
    <span class="assistant-badge">Режим ассистента</span>
  </div>
  <div class="page-title">
    <h1 id="conf-title">Редактор спикеров</h1>
    <p>Все изменения сохраняются мгновенно</p>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаю список спикеров...</p>
  </div>
  <div id="error-msg" class="error-msg hidden"></div>

  <div id="main" class="hidden">
    <div class="search-box">
      <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" class="search-input" id="search" placeholder="Поиск по имени..." oninput="filterSpeakers()" />
    </div>
    <p class="count-info" id="count-info"></p>
    <div class="speakers-list" id="speakers-list"></div>
  </div>
</div>

<!-- Лайтбокс -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  const API = '/api/v1'
  const params = new URLSearchParams(location.search)
  const eventId = params.get('event')
  const editorCode = params.get('code')

  const ROLES = {
    speaker: 'Спикер', headliner: 'Хедлайнер', moderator: 'Модератор',
    host: 'Ведущий', organizer: 'Организатор', panelist: 'Участник панели',
    workshop_leader: 'Ведущий воркшопа',
  }

  const CHECK_DEFS = [
    { label: 'Фото',      key: 'photo_url' },
    { label: 'Афиша',     key: 'poster_url' },
    { label: 'Тема',      key: '_topics_ok' },
    { label: 'Подарок после эфира', key: 'gift_after_speech_title' },
    { label: 'Ссылка подарка',      key: 'gift_after_speech_url' },
    { label: 'Подарок розыгрыша',   key: 'gift_raffle_title' },
    { label: 'Ссылка розыгрыша',    key: 'gift_raffle_url' },
  ]

  let allSpeakers = []
  let openId = null // id открытой карточки

  async function init() {
    if (!eventId || !editorCode) { showError('Неверная ссылка. Нет event и code.'); return }
    try {
      const resp = await fetch(`${API}/events/${eventId}/conference/editor-info?code=${enc(editorCode)}`)
      if (resp.status === 403) throw new Error('Неверный код доступа')
      if (!resp.ok) throw new Error('Не удалось загрузить данные')
      const data = await resp.json()
      allSpeakers = data.speakers || []
      allSpeakers.forEach(prepareSpeaker)

      // Название события
      try {
        const evResp = await fetch(`${API}/events/${eventId}`)
        if (evResp.ok) {
          const evData = await evResp.json()
          const title = evData.event?.title || evData.title
          if (title) document.getElementById('conf-title').textContent = title
        }
      } catch {}

      hide('loading')
      show('main')
      renderList(allSpeakers)
    } catch(e) {
      hide('loading')
      showError(e.message || 'Ошибка загрузки')
    }
  }

  function prepareSpeaker(sp) {
    const rawTopics = (sp.topics || []).map(t => typeof t === 'string' ? t : t.topic).filter(Boolean)
    sp._topics = rawTopics.length > 0 ? rawTopics : ['']
    sp._topics_ok = rawTopics.length > 0
  }

  function renderList(list) {
    const countEl = document.getElementById('count-info')
    countEl.textContent = `Спикеров: ${list.length}`

    const container = document.getElementById('speakers-list')
    container.innerHTML = ''

    if (list.length === 0) {
      container.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:32px">Никого не нашлось</p>'
      return
    }

    list.forEach(sp => {
      const card = buildCard(sp)
      container.appendChild(card)
    })
  }

  function buildCard(sp) {
    const div = document.createElement('div')
    div.className = 'speaker-card'
    div.dataset.id = sp.id

    const checks = CHECK_DEFS.map(c => ({
      label: c.label,
      ok: c.key === '_topics_ok' ? sp._topics_ok : !!(sp[c.key]?.trim?.() || sp[c.key])
    }))
    const warnCount = checks.filter(c => !c.ok).length

    const initials = (sp.name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()

    // Шапка карточки
    const header = document.createElement('div')
    header.className = 'speaker-header'
    header.innerHTML = `
      <div class="avatar">
        ${sp.photo_url ? `<img src="${esc(sp.photo_url)}" alt="${esc(sp.name)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">` : ''}
        <span class="avatar-placeholder" ${sp.photo_url ? 'style="display:none"' : ''}>${initials}</span>
      </div>
      <div class="sp-meta">
        <div class="sp-name">${esc(sp.name)}</div>
        <div class="sp-role">${ROLES[sp.role] || sp.role}</div>
        <div class="sp-badges">
          ${warnCount > 0
            ? `<span class="badge badge-warn">⚠ незаполнено: ${warnCount}</span>`
            : `<span class="badge badge-ok">✓ всё заполнено</span>`}
          ${checks.filter(c=>!c.ok).slice(0,3).map(c=>`<span class="badge badge-warn">${c.label}</span>`).join('')}
        </div>
      </div>
      <button type="button" class="toggle-btn" id="toggle-${sp.id}">▾</button>
    `
    header.onclick = () => toggleCard(sp.id, div)

    // Форма редактирования
    const form = document.createElement('div')
    form.className = 'speaker-form'
    form.id = `form-${sp.id}`
    form.innerHTML = buildFormHtml(sp)

    div.appendChild(header)
    div.appendChild(form)

    // После вставки — listeners на preview
    setTimeout(() => {
      setThumbCard(`thumb-${sp.id}-photo`, sp.photo_url)
      setThumbCard(`thumb-${sp.id}-poster`, sp.poster_url)
    }, 0)

    return div
  }

  function buildFormHtml(sp) {
    const id = sp.id
    const topics = sp._topics
    const f = (key) => `f-${id}-${key}`

    return `
      <div class="form-section-title">Выступление</div>

      <div class="field">
        <label>Темы выступления</label>
        <div class="topics-list" id="topics-${id}">
          ${topics.map((t, i) => `
            <div class="topic-row" id="trow-${id}-${i}">
              ${topics.length > 1 ? `<div class="topic-num">${i+1}</div>` : ''}
              <textarea rows="2" onchange="updateTopicVal(${id},${i},this.value);updateCardHints(${id})">${escText(t)}</textarea>
              ${topics.length > 1 ? `<button type="button" class="btn-remove-topic" onclick="removeTopicCard(${id},${i})">✕</button>` : ''}
            </div>
          `).join('')}
        </div>
        <button type="button" class="btn-add-topic" onclick="addTopicCard(${id})">＋ Добавить тему</button>
        ${!sp._topics_ok ? `<div class="field-default-hint" id="hint-${id}-topics">Если тема не указана, в программе и знакомстве со спикерами укажем: <strong>«Тема уточняется»</strong></div>` : ''}
      </div>

      <div class="form-section-title">🎁 Подарок после эфира</div>
      <div class="field">
        <label>Название</label>
        <textarea id="${f('gas-title')}" rows="2" oninput="updateCardHints(${id})">${escText(sp.gift_after_speech_title)}</textarea>
        ${!sp.gift_after_speech_title ? `<div class="field-default-hint" id="hint-${id}-gas-title">Если название не указано, в рассылке укажем: <strong>«Для получения материалов пишите в личку слово ivision»</strong></div>` : ''}
      </div>
      <div class="field">
        <label>Ссылка / инструкция как получить</label>
        <textarea id="${f('gas-url')}" rows="3" oninput="updateCardHints(${id})">${escText(sp.gift_after_speech_url)}</textarea>
        ${!sp.gift_after_speech_url && buildGasUrlHint(sp) ? `<div class="field-default-hint" id="hint-${id}-gas-url">${buildGasUrlHint(sp)}</div>` : ''}
      </div>

      <div class="form-section-title">🎲 Подарок для розыгрыша</div>
      <div class="field">
        <label>Название</label>
        <textarea id="${f('gr-title')}" rows="2">${escText(sp.gift_raffle_title)}</textarea>
      </div>
      <div class="field">
        <label>Ссылка / инструкция как получить</label>
        <textarea id="${f('gr-url')}" rows="3">${escText(sp.gift_raffle_url)}</textarea>
      </div>

      <div class="form-section-title">🔑 Кодовое слово для презентации</div>
      <div class="field">
        <label>Кодовое слово (уникальное для каждого спикера)</label>
        <input type="text" id="${f('keyword-code')}" value="${esc(sp.keyword_code)}" style="text-transform:uppercase" />
      </div>

      <div class="form-section-title">Профиль</div>

      <div class="field">
        <label>Имя и фамилия</label>
        <input type="text" id="${f('name')}" value="${esc(sp.name)}" />
      </div>
      <div class="field">
        <label>Должность / специализация</label>
        <input type="text" id="${f('title')}" value="${esc(sp.title)}" />
      </div>
      <div class="field">
        <label>Регалии (каждая с новой строки)</label>
        <textarea id="${f('achievements')}" rows="5">${escText(Array.isArray(sp.achievements) ? sp.achievements.join('\n') : (sp.achievements||''))}</textarea>
      </div>
      <div class="field">
        <label>Фото и афиша</label>
        <div class="media-row">
          <div class="media-item">
            <div class="thumb-click thumb-photo" id="thumb-${id}-photo" onclick="openLightbox(this)">
              <span class="thumb-empty-sm">нет фото</span>
              <span class="zoom-icon">🔍</span>
            </div>
            <span class="media-label-sm">Фото</span>
          </div>
          <div class="media-item">
            <div class="thumb-click thumb-poster-v" id="thumb-${id}-poster" onclick="openLightbox(this)">
              <span class="thumb-empty-sm">нет афиши</span>
              <span class="zoom-icon">🔍</span>
            </div>
            <span class="media-label-sm">Афиша</span>
          </div>
        </div>
        <p style="font-size:11px;color:#a0aab4;margin-top:6px">Для замены фото/афиши — обратитесь к организаторам</p>
      </div>

      <div class="form-section-title">Контакты и Telegram</div>

      <div class="field">
        <label>Telegram-канал</label>
        <input type="url" id="${f('tg-channel-url')}" value="${esc(sp.tg_channel_url)}" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Instagram</label>
          <input type="url" id="${f('instagram-url')}" value="${esc(sp.instagram_url)}" />
        </div>
        <div class="field">
          <label>Сайт</label>
          <input type="url" id="${f('website-url')}" value="${esc(sp.website_url)}" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>ID канала</label>
          <input type="text" id="${f('tg-channel-id')}" value="${esc(sp.tg_channel_id)}" />
        </div>
        <div class="field">
          <label>ID личного аккаунта</label>
          <input type="text" id="${f('personal-tg-id')}" value="${esc(sp.personal_tg_id)}" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Ник личного аккаунта</label>
          <input type="text" id="${f('personal-tg-username')}" value="${esc(sp.personal_tg_username)}" />
        </div>
        <div class="field">
          <label>Ник ассистента</label>
          <input type="text" id="${f('assistant-tg-username')}" value="${esc(sp.assistant_tg_username)}" />
        </div>
      </div>

      <div class="save-row">
        <button class="save-btn" id="save-${id}" onclick="saveSpeaker(${id})">
          <span id="save-txt-${id}">Сохранить</span>
          <div class="btn-spinner hidden" id="save-spin-${id}"></div>
        </button>
        <span class="saved-label" id="saved-${id}">✓ Сохранено</span>
      </div>
    `
  }

  // topics per-card: храним в allSpeakers
  function updateTopicVal(spId, idx, val) {
    const sp = allSpeakers.find(s => s.id === spId)
    if (sp) sp._topics[idx] = val
  }

  function addTopicCard(spId) {
    const sp = allSpeakers.find(s => s.id === spId)
    if (!sp) return
    sp._topics.push('')
    rerenderTopics(sp)
  }

  function removeTopicCard(spId, idx) {
    const sp = allSpeakers.find(s => s.id === spId)
    if (!sp) return
    sp._topics.splice(idx, 1)
    if (sp._topics.length === 0) sp._topics = ['']
    rerenderTopics(sp)
  }

  function rerenderTopics(sp) {
    const id = sp.id
    const container = document.getElementById(`topics-${id}`)
    if (!container) return
    container.innerHTML = sp._topics.map((t, i) => `
      <div class="topic-row" id="trow-${id}-${i}">
        ${sp._topics.length > 1 ? `<div class="topic-num">${i+1}</div>` : ''}
        <textarea rows="2" onchange="updateTopicVal(${id},${i},this.value)">${escText(t)}</textarea>
        ${sp._topics.length > 1 ? `<button type="button" class="btn-remove-topic" onclick="removeTopicCard(${id},${i})">✕</button>` : ''}
      </div>
    `).join('')
  }

  function toggleCard(spId, cardEl) {
    const form = document.getElementById(`form-${spId}`)
    const btn = document.getElementById(`toggle-${spId}`)
    if (!form) return
    const isOpen = form.classList.contains('visible')
    form.classList.toggle('visible', !isOpen)
    btn.classList.toggle('open', !isOpen)
    btn.textContent = isOpen ? '▾' : '▴'
  }

  function setThumbCard(thumbId, url) {
    const el = document.getElementById(thumbId)
    if (!el) return
    if (url) {
      el.dataset.url = url
      el.innerHTML = `<img src="${esc(url)}" onerror="this.parentNode.innerHTML='<span class=thumb-empty-sm>не загрузилось</span>'"><span class="zoom-icon">🔍</span>`
    }
  }

  function openLightbox(el) {
    const url = el.dataset.url
    if (!url) return
    document.getElementById('lightbox-img').src = url
    document.getElementById('lightbox').classList.add('open')
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open')
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox() })

  function updateThumb(inputId, thumbId) {
    const url = (document.getElementById(inputId)?.value || '').trim()
    const el = document.getElementById(thumbId)
    if (!el) return
    if (url && url.startsWith('http')) {
      el.innerHTML = `<img src="${esc(url)}" onerror="this.parentNode.innerHTML=''">`
    } else {
      el.innerHTML = ''
    }
  }

  function getVal(id) { return (document.getElementById(id)?.value || '').trim() }

  async function saveSpeaker(spId) {
    const btn = document.getElementById(`save-${spId}`)
    const txt = document.getElementById(`save-txt-${spId}`)
    const spin = document.getElementById(`save-spin-${spId}`)
    const savedLbl = document.getElementById(`saved-${spId}`)
    const sp = allSpeakers.find(s => s.id === spId)
    if (!sp) return

    btn.disabled = true
    txt.textContent = 'Сохраняю...'
    spin.classList.remove('hidden')
    savedLbl.style.display = 'none'

    const f = (key) => `f-${spId}-${key}`

    const achText = getVal(f('achievements'))
    const achArr = achText.split('\n').map(s=>s.trim()).filter(Boolean)
    const cleanTopics = sp._topics.map(t=>t.trim()).filter(Boolean)

    const payload = {
      name: getVal(f('name')) || undefined,
      title: getVal(f('title')) || undefined,
      achievements: achArr,
      tg_channel_url: getVal(f('tg-channel-url')) || undefined,
      instagram_url: getVal(f('instagram-url')) || undefined,
      website_url: getVal(f('website-url')) || undefined,
      tg_channel_id: getVal(f('tg-channel-id')) || undefined,
      personal_tg_id: getVal(f('personal-tg-id')) || undefined,
      personal_tg_username: getVal(f('personal-tg-username')) || undefined,
      assistant_tg_username: getVal(f('assistant-tg-username')) || undefined,
      topics: cleanTopics,
      gift_after_speech_title: getVal(f('gas-title')) || undefined,
      gift_after_speech_url: getVal(f('gas-url')) || undefined,
      gift_raffle_title: getVal(f('gr-title')) || undefined,
      gift_raffle_url: getVal(f('gr-url')) || undefined,
      keyword_code: getVal(f('keyword-code')).toUpperCase() || undefined,
    }

    try {
      const resp = await fetch(
        `${API}/events/${eventId}/conference/speakers/${spId}/editor?code=${enc(editorCode)}`,
        { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
      )
      if (!resp.ok) {
        const err = await resp.json().catch(()=>({}))
        throw new Error(err.detail || 'Ошибка сохранения')
      }
      const data = await resp.json()
      // Обновляем данные в памяти
      Object.assign(sp, data.speaker)
      prepareSpeaker(sp)
      // Обновляем бейджи в шапке карточки
      refreshCardBadges(spId, sp)

      savedLbl.style.display = 'flex'
      setTimeout(() => { savedLbl.style.display = 'none' }, 4000)
    } catch(e) {
      alert('Ошибка: ' + (e.message || 'Попробуйте ещё раз'))
    } finally {
      btn.disabled = false
      txt.textContent = 'Сохранить'
      spin.classList.add('hidden')
    }
  }

  function refreshCardBadges(spId, sp) {
    const card = document.querySelector(`.speaker-card[data-id="${spId}"]`)
    if (!card) return
    const checks = CHECK_DEFS.map(c => ({
      label: c.label,
      ok: c.key === '_topics_ok' ? sp._topics_ok : !!(sp[c.key]?.trim?.() || sp[c.key])
    }))
    const warnCount = checks.filter(c => !c.ok).length
    const badgesEl = card.querySelector('.sp-badges')
    if (badgesEl) {
      badgesEl.innerHTML = warnCount > 0
        ? `<span class="badge badge-warn">⚠ незаполнено: ${warnCount}</span>${checks.filter(c=>!c.ok).slice(0,3).map(c=>`<span class="badge badge-warn">${c.label}</span>`).join('')}`
        : `<span class="badge badge-ok">✓ всё заполнено</span>`
    }
    // Обновляем имя и аватар
    const nameEl = card.querySelector('.sp-name')
    if (nameEl) nameEl.textContent = sp.name || ''
    if (sp.photo_url) {
      const avatarEl = card.querySelector('.avatar')
      if (avatarEl) {
        const initials = (sp.name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()
        avatarEl.innerHTML = `<img src="${esc(sp.photo_url)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><span class="avatar-placeholder" style="display:none">${initials}</span>`
      }
    }
  }

  function buildGasUrlHintForSp(sp) {
    const username = (sp.personal_tg_username || sp.assistant_tg_username || '').replace(/^@/, '')
    if (!username) return ''
    const url = `https://telegram.me/${username}?text=ivision`
    return `Если ссылка не указана, в рассылке укажем: <strong>${esc(url)}</strong>`
  }

  // buildGasUrlHint используется в шаблоне buildFormHtml
  function buildGasUrlHint(sp) { return buildGasUrlHintForSp(sp) }

  function updateCardHints(spId) {
    const sp = allSpeakers.find(s => s.id === spId)
    if (!sp) return
    const f = (key) => `f-${spId}-${key}`

    // Темы
    const hasTopics = sp._topics.some(t => t.trim())
    toggleHint(`hint-${spId}-topics`, !hasTopics,
      `Если тема не указана, в программе и знакомстве со спикерами укажем: <strong>«Тема уточняется»</strong>`)

    // Название подарка
    const gasTitle = (document.getElementById(f('gas-title'))?.value || '').trim()
    toggleHint(`hint-${spId}-gas-title`, !gasTitle,
      `Если название не указано, в рассылке укажем: <strong>«Для получения материалов пишите в личку слово ivision»</strong>`)

    // Ссылка подарка — только если есть ник спикера
    const gasUrl = (document.getElementById(f('gas-url'))?.value || '').trim()
    const gasUrlHint = buildGasUrlHintForSp(sp)
    if (gasUrlHint) toggleHint(`hint-${spId}-gas-url`, !gasUrl, gasUrlHint)
  }

  function toggleHint(hintId, show, html) {
    let el = document.getElementById(hintId)
    if (show) {
      if (!el) {
        // не можем легко найти куда вставить — ищем textarea перед этим hint
        // Hint уже должен быть в DOM из шаблона, просто показываем/скрываем
        return
      }
      el.style.display = ''
      el.innerHTML = html
    } else {
      if (el) el.style.display = 'none'
    }
  }

  function filterSpeakers() {
    const q = document.getElementById('search').value.trim().toLowerCase()
    const filtered = q ? allSpeakers.filter(s => s.name.toLowerCase().includes(q)) : allSpeakers
    renderList(filtered)
  }

  function showError(msg) {
    hide('loading')
    const el = document.getElementById('error-msg')
    el.textContent = msg
    show('error-msg')
  }

  function show(id) { document.getElementById(id)?.classList.remove('hidden') }
  function hide(id) { document.getElementById(id)?.classList.add('hidden') }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  function escText(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
  function enc(s) { return encodeURIComponent(s||'') }

  init()
</script>
</body>
</html>
