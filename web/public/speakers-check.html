<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спикеры конференции</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(45deg, #25455D, #0a1520);
      min-height: 100vh;
      color: #1a2535;
    }

    .page-header {
      background: linear-gradient(45deg, #25455D, #0a1520);
      padding: 24px 20px 20px;
      text-align: center;
    }

    .logo-text {
      color: #FFCFA4;
      font-size: 20px;
      font-weight: 700;
      display: block;
      margin-bottom: 14px;
    }

    .page-title { color: #ffffff; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .conf-name { color: rgba(255,255,255,0.5); font-size: 13px; display: block; margin-bottom: 4px; }
    .page-subtitle { color: rgba(255,255,255,0.55); font-size: 14px; line-height: 1.5; }

    /* Своя карточка — выделена */
    .own-highlight {
      background: rgba(255,207,164,0.12);
      border: 1.5px solid rgba(255,207,164,0.35);
      border-radius: 18px;
      padding: 14px 16px 16px;
      margin: 0 16px 8px;
      max-width: 568px;
      margin-left: auto;
      margin-right: auto;
    }
    .own-label {
      font-size: 11px;
      font-weight: 700;
      color: #FFCFA4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .search-box { position: relative; margin-bottom: 12px; }
    .search-input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.3); }
    .search-input:focus { border-color: rgba(255,207,164,0.5); background: rgba(255,255,255,0.1); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); pointer-events: none; }

    .speakers-list { display: flex; flex-direction: column; gap: 8px; }

    /* Карточка — доступна для редактирования (своя) */
    .speaker-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .speaker-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.22); }
    .speaker-card:active { transform: scale(0.98); }

    /* Карточка — только просмотр (чужая) */
    .speaker-card.readonly {
      background: rgba(255,255,255,0.07);
      box-shadow: none;
      cursor: default;
    }
    .speaker-card.readonly:hover { transform: none; box-shadow: none; }

    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #e8edf2;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 18px; color: #a0aab4; font-weight: 700; }

    /* Аватар серый для чужих */
    .speaker-card.readonly .avatar { background: rgba(255,255,255,0.1); }
    .speaker-card.readonly .avatar-placeholder { color: rgba(255,255,255,0.3); }

    .speaker-info { flex: 1; min-width: 0; }

    .speaker-name { font-weight: 700; font-size: 15px; color: #1a2535; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .speaker-card.readonly .speaker-name { color: rgba(255,255,255,0.6); }

    .speaker-role { font-size: 12px; color: #6b7a8d; margin-bottom: 5px; }
    .speaker-card.readonly .speaker-role { color: rgba(255,255,255,0.3); }

    .field-status { display: flex; flex-wrap: wrap; gap: 4px; }

    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 500; }
    .badge-ok { background: #e8f5e9; color: #2e7d32; }
    .badge-warn { background: #fff8e1; color: #e65100; }
    .badge-ok-dark { background: rgba(46,125,50,0.2); color: rgba(255,255,255,0.5); }
    .badge-warn-dark { background: rgba(230,81,0,0.2); color: rgba(255,200,100,0.7); }

    .arrow { color: #FFCFA4; flex-shrink: 0; font-size: 20px; }

    .poster-thumb { width: 32px; height: 48px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #e8edf2; }
    .poster-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .speaker-card.readonly .poster-thumb { background: rgba(255,255,255,0.08); }

    .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,207,164,0.3); border-top-color: #FFCFA4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); border-radius: 14px; padding: 16px; color: #ffaaaa; font-size: 14px; text-align: center; }

    .empty-state { text-align: center; padding: 32px 20px; color: rgba(255,255,255,0.4); font-size: 14px; }

    .edit-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(90deg, #FFCFA4, #f5a65b);
      color: #1a2535;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="page-header">
  <span class="logo-text">iViSiON: ПЛЮСОН</span>
  <h1 class="page-title">Спикеры конференции</h1>
  <span id="conf-name" class="conf-name"></span>
  <p class="page-subtitle">Найдите себя и проверьте свои данные</p>
</div>

<div class="content">

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаю список...</p>
  </div>

  <div id="error" class="error-msg hidden"></div>

  <div id="main" class="hidden">

    <!-- Своя карточка (если есть реф-код) -->
    <div id="own-block" class="hidden" style="margin-bottom:20px">
      <div class="own-label">
        <span>★</span> Ваша карточка
      </div>
      <div id="own-card"></div>
    </div>

    <!-- Остальные спикеры -->
    <div id="others-block" class="hidden">
      <div class="section-label" id="others-label">Другие спикеры</div>
      <div class="search-box">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="search" placeholder="Поиск по имени..." oninput="filterOthers()" />
      </div>
      <div class="speakers-list" id="others-list"></div>
    </div>

    <!-- Если нет реф-кода — общий список -->
    <div id="all-block" class="hidden">
      <div class="search-box">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="search-all" placeholder="Начните вводить имя..." oninput="filterAll()" />
      </div>
      <div class="speakers-list" id="all-list"></div>
    </div>

  </div>
</div>

<script>
  const API = '/api/v1'

  const params = new URLSearchParams(location.search)
  const eventId = params.get('event')
  const myCode  = params.get('code')  // персональный реф-код спикера (необязательный)

  const ROLES = {
    speaker: 'Спикер', headliner: 'Хедлайнер', moderator: 'Модератор',
    host: 'Ведущий', organizer: 'Организатор', panelist: 'Участник панели',
    workshop_leader: 'Ведущий воркшопа',
  }

  let allSpeakers = []
  let mySpeakerId = null

  async function init() {
    if (!eventId) { showError('Не указан ID конференции в ссылке.'); return }

    try {
      const resp = await fetch(`${API}/events/${eventId}/conference/speakers/public`)
      if (!resp.ok) throw new Error('Не удалось загрузить список')
      const data = await resp.json()
      allSpeakers = data.speakers || []

      // Название события
      try {
        const evResp = await fetch(`${API}/events/${eventId}`)
        if (evResp.ok) {
          const evData = await evResp.json()
          const title = evData.event?.title || evData.title
          if (title) document.getElementById('conf-name').textContent = title
        }
      } catch {}

      // Если есть реф-код — находим своего спикера
      if (myCode) {
        try {
          const myResp = await fetch(`${API}/events/${eventId}/conference/speakers/by-code/${myCode}`)
          if (myResp.ok) {
            const myData = await myResp.json()
            mySpeakerId = myData.speaker?.id
          }
        } catch {}
      }

      hide('loading')
      show('main')
      render()
    } catch(e) {
      showError('Не удалось загрузить данные. Проверьте ссылку или попробуйте позже.')
    }
  }

  function render() {
    if (mySpeakerId) {
      // Режим с реф-кодом: своя карточка + остальные серые
      const me = allSpeakers.find(s => s.id === mySpeakerId)
      const others = allSpeakers.filter(s => s.id !== mySpeakerId)

      if (me) {
        document.getElementById('own-card').innerHTML = buildCard(me, true)
        show('own-block')
      }

      if (others.length > 0) {
        renderOthers(others)
        show('others-block')
        document.getElementById('others-label').textContent = `Другие спикеры (${others.length})`
      }
    } else {
      // Режим без кода: все карточки одинаковые (только просмотр)
      renderAll(allSpeakers)
      show('all-block')
    }
  }

  function renderOthers(list) {
    document.getElementById('others-list').innerHTML = list.length > 0
      ? list.map(sp => buildCard(sp, false)).join('')
      : '<div class="empty-state">Никого не нашлось</div>'
  }

  function renderAll(list) {
    document.getElementById('all-list').innerHTML = list.length > 0
      ? list.map(sp => buildCard(sp, false)).join('')
      : '<div class="empty-state">Никого не нашлось</div>'
  }

  function buildCard(sp, isMine) {
    const topics = (sp.topics || []).map(t => typeof t === 'string' ? t : t.topic).filter(Boolean)
    const checks = getChecks(sp, topics)
    const warnCount = checks.filter(c => !c.ok).length

    const initials = (sp.name || '?').split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase()
    const roleLabel = ROLES[sp.role] || sp.role || 'Спикер'

    const avatarHtml = sp.photo_url
      ? `<img src="${esc(sp.photo_url)}" alt="${esc(sp.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="avatar-placeholder" style="display:none">${initials}</span>`
      : `<span class="avatar-placeholder">${initials}</span>`

    const posterHtml = sp.poster_url && isMine
      ? `<div class="poster-thumb"><img src="${esc(sp.poster_url)}" alt="Афиша"></div>`
      : ''

    if (isMine) {
      // Своя карточка — белая, кликабельная, со стрелкой
      const badgesHtml = checks.map(c =>
        `<span class="badge ${c.ok ? 'badge-ok' : 'badge-warn'}">${c.ok ? '✓' : '⚠'} ${c.label}</span>`
      ).join('')
      return `
        <a class="speaker-card" href="speaker-edit.html?event=${esc(eventId)}&code=${esc(myCode)}">
          <div class="avatar">${avatarHtml}</div>
          <div class="speaker-info">
            <div class="speaker-name">${esc(sp.name)}</div>
            <div class="speaker-role">${roleLabel}</div>
            <div class="field-status">${badgesHtml}</div>
          </div>
          ${posterHtml}
          <span class="arrow">›</span>
        </a>
      `
    } else {
      // Чужая карточка — серая, некликабельная
      const statusText = warnCount > 0
        ? `<span class="badge badge-warn-dark">⚠ ${warnCount} не заполнено</span>`
        : `<span class="badge badge-ok-dark">✓ заполнено</span>`
      return `
        <div class="speaker-card readonly">
          <div class="avatar">${avatarHtml}</div>
          <div class="speaker-info">
            <div class="speaker-name">${esc(sp.name)}</div>
            <div class="speaker-role">${roleLabel}</div>
            <div class="field-status">${statusText}</div>
          </div>
        </div>
      `
    }
  }

  function getChecks(sp, topics) {
    return [
      { label: 'Фото',     ok: !!sp.photo_url },
      { label: 'Тема',     ok: topics.length > 0 },
      { label: 'Подарок после эфира',  ok: !!(sp.gift_after_speech_title) },
      { label: 'Ссылка',  ok: !!(sp.gift_after_speech_url) },
      { label: 'Подарок розыгрыша',    ok: !!sp.gift_raffle_title },
      { label: 'Ссылка розыгрыша',     ok: !!sp.gift_raffle_url },
    ]
  }

  function filterOthers() {
    const q = document.getElementById('search').value.trim().toLowerCase()
    const others = allSpeakers.filter(s => s.id !== mySpeakerId)
    const filtered = q ? others.filter(s => s.name.toLowerCase().includes(q)) : others
    renderOthers(filtered)
  }

  function filterAll() {
    const q = document.getElementById('search-all').value.trim().toLowerCase()
    const filtered = q ? allSpeakers.filter(s => s.name.toLowerCase().includes(q)) : allSpeakers
    renderAll(filtered)
  }

  function showError(msg) {
    hide('loading')
    const el = document.getElementById('error')
    el.textContent = msg
    show('error')
  }

  function show(id) { document.getElementById(id)?.classList.remove('hidden') }
  function hide(id) { document.getElementById(id)?.classList.add('hidden') }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

  init()
</script>
</body>
</html>
