# Фрагмент для nginx-конфига pluson.ru — отдача HLS-плейлистов и сегментов
# вебинарной комнаты. Вставить внутрь server {} блока pluson.ru.
#
# Зритель получает: https://pluson.ru/live/{stream_key}/index.m3u8
#
# ⚠️⚠️ ОТДАЁМ ФАЙЛАМИ С ДИСКА, А НЕ ПРОКСИРОВАНИЕМ В MediaMTX (25.09.2026).
#
# Раньше здесь был `proxy_pass http://127.0.0.1:8888`. MediaMTX v1.19 требует от
# плеера cookie-сессию: мастер-плейлист отвечает 302 + `Set-Cookie: hlsSession=…`,
# а дочерний плейлист и сегменты БЕЗ неё отдают 401. На живом эфире это
# развалилось у всех, кроме Safari (он играет HLS нативно и куку посылает сам):
#   • hls.js грузит плейлисты через XHR, а XHR куки по умолчанию не посылает;
#   • кука не переживает перезагрузку страницы, истекает по неактивности и
#     теряется при рестарте MediaMTX — зритель получал 401 ПОСРЕДИ просмотра
#     («появилось, побыло и пропало»);
#   • лечить только клиента бесполезно: в кеше браузера остаётся старый JS, и
#     правка до зрителя просто не доезжает.
#
# MediaMTX пишет те же плейлисты и сегменты на диск (`hlsDirectory` в
# mediamtx.yml). Файлам cookie не нужна — nginx отдаёт их напрямую, 401 исчез
# как класс. Проверено на живом эфире: мастер 200, дочерний 200, сегмент 200.
#
# ⚠️ `hlsDirectory` в mediamtx.yml ОБЯЗАТЕЛЕН — без него каталог пуст и зритель
# получит 404 вместо видео.
# ⚠️ Диск не растёт: MediaMTX держит на диске только `hlsSegmentCount` (7) свежих
# сегментов и удаляет старые сам — проверено, ~10 файлов / 3,8 МБ на поток.
# ⚠️ CORS здесь можно ставить "*": своей cookie-аутентификации у файлов нет, а с
#   `Allow-Credentials` "*" был бы запрещён стандартом (на этом и погорели).

location /live/ {
    root /var/www/plusson/media-server/hlsout;

    # Плейлист переписывается каждые 2 секунды — не кешируем вовсе.
    location ~ /live/.+\.m3u8$ {
        root /var/www/plusson/media-server/hlsout;
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Сегменты неизменяемы — короткий кеш снимает нагрузку.
    add_header Cache-Control "max-age=10" always;
    add_header Access-Control-Allow-Origin "*" always;
}
