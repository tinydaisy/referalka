# Фрагмент для nginx-конфига pluson.ru — отдача HLS вебинарной комнаты.
# Вставить внутрь server {} блока pluson.ru.
#
# Зритель получает: https://pluson.ru/live/{stream_key}/index.m3u8
# Файлы лежат на диске: /var/www/plusson/media-server/hlsout/live/{stream_key}/
# (их пишет MediaMTX по параметру `hlsDirectory`)
#
# ⚠️ path в MediaMTX = live/{key}, поэтому переписываем /hls/ → /live/.

# ⚠️⚠️ ОТДАЁМ ФАЙЛЫ С ДИСКА, А НЕ ПРОКСИРОВАНИЕМ (26.09.2026, версия 2).
#
# MediaMTX требует cookie-сессию, а MI Browser на Android её не принимает ни с
# `SameSite=None; Partitioned`, ни с `SameSite=Lax`: в логе nginx было 25 ошибок
# 401 на `main_stream.m3u8` и НИ ОДНОГО успешного запроса. Файлам cookie не нужна.
#
# ⚠️⚠️ У СХЕМЫ ДВЕ ЧАСТИ: этот `root` И `hlsDirectory` в mediamtx.yml.
# 25.09 первая попытка положила видео У ВСЕХ, включая работавший Safari:
# `hlsDirectory` затёрся при откате конфига, MediaMTX перестал писать сегменты, а
# СТАРЫЕ плейлисты остались лежать — nginx отдавал их с кодом 200, плеер шёл за
# сегментами и получал 404. Ломается МОЛЧА и в опасную сторону.
#
# ⚠️ ПЕРЕД ВЫКАТКОЙ ОБЯЗАТЕЛЬНО проверить, что сегменты РЕАЛЬНО пишутся:
#   find /var/www/plusson/media-server/hlsout -name '*.ts' | wc -l    # > 0
# Наличия `.m3u8` НЕДОСТАТОЧНО — именно на этом и погорели.
#
# Проверено 26.09 без всякой cookie: мастер 200, плейлист 200, сегмент 200 (435 КБ).

location /live/ {
    root /var/www/plusson/media-server/hlsout;

    # Плейлист переписывается каждые 2 секунды — не кешируем вовсе.
    location ~ /live/.+\.m3u8$ {
        root /var/www/plusson/media-server/hlsout;
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ⚠️ CORS "*" здесь МОЖНО: у файлов своей cookie-аутентификации нет. При
    # проксировании он ломал всё (MediaMTX отдавал свой заголовок +
    # Allow-Credentials, и браузер отбрасывал ответ с двумя разными CORS).
    add_header Cache-Control "max-age=10" always;
    add_header Access-Control-Allow-Origin "*" always;
}


# ⚠️⚠️ ОТДАЧУ ФАЙЛАМИ С ДИСКА ПРОБОВАЛИ 25.09.2026 — НЕ ПОВТОРЯТЬ БЕЗ ПРОВЕРКИ.
#
# Идея была верная: `root .../hlsout` + `hlsDirectory` в mediamtx.yml, чтобы
# cookie-сессия MediaMTX не требовалась вовсе. Но на живом эфире это положило
# видео у ВСЕХ браузеров, включая Safari, который до этого работал.
#
# Почему: `hlsDirectory` затёрся при откате mediamtx.yml из бэкапа, MediaMTX
# перестал писать сегменты, а СТАРЫЕ плейлисты остались лежать на диске. nginx
# бодро отдавал их с кодом 200 — плеер получал список, шёл за сегментами и
# получал 404. Симптом: «видео подгружается» и затем чёрный экран, везде.
#
# Урок: у этой схемы ДВЕ части (`root` в nginx + `hlsDirectory` в mediamtx.yml),
# и если отвалится вторая, первая не падает, а отдаёт мусор с кодом 200 — то есть
# ломается МОЛЧА и в опасную сторону. Проксирование так деградировать не может:
# нет потока — сразу видно по коду ответа.
#
# Если возвращаться к отдаче с диска — только вне эфира и с проверкой, что
# `.ts` файлы РЕАЛЬНО появляются: `find .../hlsout -name '*.ts' | wc -l` больше
# нуля, а не только наличие .m3u8.
