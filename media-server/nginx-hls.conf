# Фрагмент для nginx-конфига pluson.ru — проксирование HLS-плейлистов и сегментов
# от MediaMTX (127.0.0.1:8888) наружу. Вставить внутрь server {} блока pluson.ru.
#
# Зритель получает: https://pluson.ru/hls/{stream_key}/index.m3u8
# MediaMTX отдаёт:   http://127.0.0.1:8888/live/{stream_key}/index.m3u8
#
# ⚠️ path в MediaMTX = live/{key}, поэтому переписываем /hls/ → /live/.

location /hls/ {
    # /hls/KEY/index.m3u8 → http://127.0.0.1:8888/live/KEY/index.m3u8
    rewrite ^/hls/(.*)$ /live/$1 break;
    proxy_pass http://127.0.0.1:8888;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # HLS чувствителен к буферизации — отдаём сразу
    proxy_buffering off;
    # cookieCheck (MediaMTX v1.19) — сессия зрителя живёт в куке, пропускаем её
    proxy_pass_header Set-Cookie;
    add_header Cache-Control "no-cache" always;

    # ⚠️⚠️ CORS ЗДЕСЬ НЕ ДОБАВЛЯЕМ (25.09.2026, чёрный экран у зрителей).
    # Здесь стоял `add_header Access-Control-Allow-Origin "*" always`. MediaMTX
    # сам отдаёт Access-Control-Allow-Origin (конкретный origin) вместе с
    # Access-Control-Allow-Credentials: true — наш заголовок приходил ВТОРЫМ.
    # Браузер видит два разных CORS-заголовка и отбрасывает ответ целиком, а с
    # куками значение "*" запрещено стандартом. Зрителю это выглядело как
    # чёрный прямоугольник без видео и звука.
    # Разрешённые источники настраиваются в mediamtx.yml (hlsAllowOrigin), а не тут.

    # .m3u8 не кешируем, сегменты .ts/.mp4 можно чуть-чуть
    location ~ \.(ts|mp4|m4s)$ {
        rewrite ^/hls/(.*)$ /live/$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_buffering off;
        proxy_pass_header Set-Cookie;
        add_header Cache-Control "max-age=2" always;
    }
}

# ⚠️⚠️ ОТДАЧУ ФАЙЛАМИ С ДИСКА ПРОБОВАЛИ 25.09.2026 — НЕ ПОВТОРЯТЬ БЕЗ ПРОВЕРКИ.
#
# Идея была верная: `root .../hlsout` + `hlsDirectory` в mediamtx.yml, чтобы
# cookie-сессия MediaMTX не требовалась вовсе. Но на живом эфире это положило
# видео у ВСЕХ браузеров, включая Safari, который до этого работал.
#
# Почему: `hlsDirectory` затёрся при откате mediamtx.yml из бэкапа, MediaMTX
# перестал писать сегменты, а СТАРЫЕ плейлисты остались лежать на диске. nginx
# бодро отдавал их с кодом 200 — плеер получал список, шёл за сегментами и
# получал 404. Симптом: «видео подгружается» и затем чёрный экран, везде.
#
# Урок: у этой схемы ДВЕ части (`root` в nginx + `hlsDirectory` в mediamtx.yml),
# и если отвалится вторая, первая не падает, а отдаёт мусор с кодом 200 — то есть
# ломается МОЛЧА и в опасную сторону. Проксирование так деградировать не может:
# нет потока — сразу видно по коду ответа.
#
# Если возвращаться к отдаче с диска — только вне эфира и с проверкой, что
# `.ts` файлы РЕАЛЬНО появляются: `find .../hlsout -name '*.ts' | wc -l` больше
# нуля, а не только наличие .m3u8.
