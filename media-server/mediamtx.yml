# PLUSSON MediaMTX — приём RTMP от видеокодера (Zoom/OBS) и раздача HLS.
#
# Клиент в дашборде вебинарной комнаты получает:
#   RTMP-адрес: rtmp://pluson.ru:1935/live/{stream_key}
#   Ключ:       {stream_key}   (вписывает в Zoom Custom Streaming / OBS)
# Зритель смотрит HLS:
#   https://pluson.ru/hls/{stream_key}/index.m3u8   (проксируется nginx на :8888)
#
# Приём потока разрешаем ТОЛЬКО если stream_key существует и активен — проверяет
# наш бэкенд через runOnConnect-хук (HTTP на localhost). Так чужой не зальёт мусор.

logLevel: info
logDestinations: [stdout]

# ── RTMP: вход от видеокодера ────────────────────────────────────────────────
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# ── HLS: выход для зрителей (nginx проксирует /hls/ → :8888) ─────────────────
# ⚠️ lowLatency-режим давал «part duration changed → error in iOS clients» и
# видео не игралось в Safari/iOS. Обычный mpegts-HLS стабилен: задержка выше
# (~6-10 сек), но проигрывается везде без ошибок муксера.
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
# ⚠️⚠️ mpegts, а НЕ fmp4 (26.09.2026). fmp4 пробовали — он разделяет видео и
# звук на ОТДЕЛЬНЫЕ дорожки (EXT-X-MEDIA + video1_stream.m3u8 + audio2_stream.m3u8)
# и требует EXT-X-VERSION:10. Старые Android-плееры раздельные дорожки часто не
# собирают — а у нас именно на Android (MI 8, 2018 г.) и был чёрный экран.
# mpegts отдаёт ОДНУ дорожку и EXT-X-VERSION:3 — это понимают все браузеры.
hlsVariant: mpegts
# ⚠️⚠️ 30, а НЕ 7 (25.09.2026). При 7 сегментах по 2 с запас всего 14 секунд:
# плеер отстаёт от эфира чуть больше — сегмент уже УДАЛЁН — 404 — видео рвётся.
# На живом эфире это давало 63 ошибки 404 за 10 минут у ВСЕХ браузеров сразу
# (iOS Safari 24, Android MI 17, iOS Chrome 17, iOS Яндекс 10) и выглядело как
# «то работает, то нет» и «у разных браузеров по-разному»: кто медленнее, тот и
# отваливался. Это НЕ особенность браузера, НЕ cookie и НЕ код плеера — часы
# ушли на правку фронта, потому что смотрели 401 и не проверили 404.
# ⚠️⚠️ ИМЕННО 7, НЕ 30 (зафиксировано 25.09.2026 перед конференцией).
# 30 действительно убирало 404 и чинило iOS Safari — но СЛОМАЛО Android MI
# Browser и iOS Яндекс, которые до этого играли. Проверено на живом эфире:
# при 7 работают iOS Safari + iOS Chrome + Android MI (3 из 5), при 30 — нет.
# Развести по браузерам нельзя: параметр серверный, один на всех. Пробовали
# второй экземпляр MediaMTX на :8889 со своим значением — RTSP/RTMP-мост между
# экземплярами не поднялся (400 Bad Request), отключён.
# ⚠️ Диагностику «видео рвётся» НАЧИНАТЬ с этого:
#   grep '/live/' /var/log/nginx/access.log | grep '\.ts' | grep -c ' 404 '
hlsSegmentCount: 12
hlsSegmentDuration: 2s

# ⚠️⚠️ ВРЕМЯ ЖИЗНИ HLS-СЕССИИ (25.09.2026). Дефолт readTimeout = 10 секунд:
# зритель отвернулся, свернул вкладку или подвисла сеть на 10 с — MediaMTX
# закрывает сессию («closed: inactive» в логе), cookie hlsSession становится
# недействительной → 401 ПОСРЕДИ просмотра, и плеер больше не пытается.
#
# Так умирало видео на Android MI Browser: 06:14:30 последний сегмент 200,
# 06:15:06 «session closed: inactive», дальше НОЛЬ запросов к /live/ — при живой
# странице (чат опрашивался каждые 4 с). То же у iOS Яндекса и Android Chrome.
#
# ⚠️ Диагностика: journalctl -u plusson-mediamtx | grep -c 'closed: inactive'
readTimeout: 300s
# Не гасить муксер сразу после ухода последнего зрителя — вернувшийся иначе
# получает пересозданный поток с новыми именами сегментов.
hlsMuxerCloseAfter: 300s
hlsAllowOrigin: "*"

# ── Отключаем то, что не нужно ───────────────────────────────────────────────
rtsp: no
webrtc: no
srt: no
api: yes                      # локальный API MediaMTX (для мониторинга статуса потоков)
apiAddress: 127.0.0.1:9997

# ── Пути потоков ─────────────────────────────────────────────────────────────
# Все потоки идут в /live/{key}. Публикацию валидирует бэкенд-хук:
# MediaMTX дёргает наш эндпоинт, тот проверяет ключ в webinar_rooms и разрешает/запрещает.
# ⚠️ MediaMTX v1.19+ не принимает runOnPublish/runOnUnpublish в pathDefaults —
# только внутри конкретного path (paths.all_others). Раньше был pathDefaults.
paths:
  all_others:
    # ── ЗАПИСЬ ЭФИРА ─────────────────────────────────────────────────────────
    # Пишем весь поток на диск (fMP4). Файлы: recordings/live/{stream_key}/{дата}.mp4
    # ⚠️ Пишется ВЕСЬ поток с момента подключения видеокодера — включая настройку
    # спикера до «Начать эфир». Физически файл НЕ обрезаем (обрезка гигабайтов
    # ради пары минут не окупается, а вернуть отрезанное нельзя): вместо этого
    # считаем webinar_recordings.live_offset_sec — на какой секунде файла начался
    # эфир. Он берётся из ИМЕНИ первого сегмента (см. recordPath ниже) и
    # webinar_sessions.started_at, а прибавляется при нарезке по спикерам.
    # ⚠️ Отсюда следует: формат имени в recordPath менять нельзя, не поправив
    # _seg_started_at в app/tasks/webinar_chunks.py — иначе смещение молча
    # перестанет считаться и метки нарезки уедут на всю подготовку.
    record: yes
    recordPath: /var/www/plusson/media-server/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    # ⚠️ 5 минут, а НЕ час. Кусок весит ~90 МБ вместо 1,1 ГБ и сразу уезжает в
    # хранилище (задача app.tasks.webinar_chunks, раз в минуту), после чего
    # стирается с диска. При часовых сегментах на диске лежал весь эфир целиком:
    # два часа ≈ 2 ГБ, а несколько параллельных эфиров забили бы диск и положили
    # ВСЮ платформу — базу, рассылки, кабинет, а не только вебинары.
    recordSegmentDuration: 5m
    # Страховка на случай, если заливка кусков сломалась: MediaMTX сам подчистит.
    # 72 часа, а не 30 дней — за месяц диск успеет кончиться раньше уборки.
    recordDeleteAfter: 72h

    # Проверка ключа при публикации потока (видеокодер подключился, поток готов).
    # $MTX_PATH = "live/{stream_key}". Бэкенд проверяет ключ в webinar_rooms → комната live.
    # ⚠️ MediaMTX v1.19 переименовал runOnPublish→runOnReady, runOnUnpublish→runOnNotReady.
    runOnReady: >
      curl -sf -m 5 -X POST
      -H "X-Bridge-Token: ${MTX_BRIDGE_TOKEN}"
      "http://127.0.0.1:8000/api/v1/internal/webinar/stream/publish?path=$MTX_PATH"
    runOnReadyRestart: no
    # Поток остановлен — уведомляем бэкенд (комната → ended).
    runOnNotReady: >
      curl -sf -m 5 -X POST
      -H "X-Bridge-Token: ${MTX_BRIDGE_TOKEN}"
      "http://127.0.0.1:8000/api/v1/internal/webinar/stream/unpublish?path=$MTX_PATH"

# ⚠️⚠️ ОБЯЗАТЕЛЕН вместе с `root` в nginx (26.09.2026): MediaMTX пишет плейлисты
# и сегменты на диск, а nginx отдаёт их файлами — тогда cookie-сессия не нужна.
# MI Browser на Android cookie не принимает вовсе (25 ошибок 401, ни одного 200).
# ⚠️ Уберёшь этот параметр, не поправив nginx — nginx начнёт отдавать СТАРЫЕ
# плейлисты с кодом 200, а сегментов не будет: 404 и чёрный экран У ВСЕХ.
hlsDirectory: /var/www/plusson/media-server/hlsout
