# Публичные маршруты ПЛЮСОНа — общий кусок для доменов клиентов (миграция 270).
#
# Ставится на сервер как /etc/nginx/snippets/plusson-public-locations.conf и
# подключается через `include` в server-блок каждого клиентского домена
# (их создаёт backend/app/services/domain_cert.py).
#
# Зачем отдельным файлом: правил много, и копировать их в конфиг каждого
# домена — гарантированный способ забыть обновить один из них при добавлении
# нового публичного маршрута. Здесь одна точка правки на все домены.
#
# ⚠️ ЧЕГО ЗДЕСЬ НЕТ И БЫТЬ НЕ ДОЛЖНО:
#   /dashboard, /admin  — кабинет клиента живёт только на pluson.ru: JWT,
#                         cookies и вебхуки платёжек завязаны на один origin;
#   /tg/, /vk/, /max/, /c/{id}/… — Mini App. Его адрес вбит в @BotFather и в
#                         настройках бота MAX, на лету не меняется.
# Всё, что сюда не попало, на домене клиента отдаёт 404 — так и задумано.

# ── Здоровье ──
location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
}

# ── Публичные страницы из FastAPI ──

# Витрина события (программа, спикеры, кабинет участника) + форма регистрации
location ~ ^/event/[^/]+(/register(-submit)?|/find-by-email)?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}

# Все события клиента (туда ведут VIP-боты по /start)
location ~ ^/o/[0-9]+$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}

# Публичная турнирная таблица этапа и регламент
location ~ ^/t/[^/]+/[0-9]+(/reglament)?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}

# Воронки лид-магнитов: 302 в бота
location ~ ^/(m|p)/[a-z0-9]+$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# Регистрация партнёров клиента
location ~ ^/partner/[0-9]+$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}

# Веб-кабинет участника МедиаЛифта
location = /medialift/me {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# ── Вебинарная комната ──

# Чат и реакции в реальном времени
location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}

# HLS-поток от MediaMTX
location /live/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_pass_header Set-Cookie;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /hls/ {
    rewrite ^/hls/(.*)$ /live/$1 break;
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── API ──
# Нужен публичным страницам: формы регистрации и заказа, вебинарный чат,
# отписка от писем и трекинг открытий (ссылки в письме ведут на домен
# отправителя — иначе почтовики считают их подозрительными).
location /api/ {
    client_max_body_size 100M;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180;
}

# ── Публичные страницы из Next.js ──
# Лендинги (/e/, /l/), возврат со стороннего лендинга (/r/), оферта (/o/{slug}),
# политика ПД (/c/{id}/privacy), кабинет спикера (/speaker/), вебинар
# (/webinar/), страницы благодарности (/thanks).
#
# ⚠️ Отдаём Next.js ВСЁ остальное, а он сам решает, что показать. Ограничить
# список маршрутов здесь нельзя: при добавлении новой публичной страницы её
# пришлось бы дописывать и сюда, а забытая правка выглядит как «страница не
# открывается только на своём домене» — ошибка, которую трудно связать с nginx.
# Дашборд и админка при заходе на чужой домен уводятся редиректом на
# основной адрес — это делает middleware.ts (проверка заголовка Host).
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
