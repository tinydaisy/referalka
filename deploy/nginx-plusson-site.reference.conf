server {
    # Проверка владения доменом для выпуска сертификата (acme.sh/certbot, webroot).
    # ⚠️ Должно стоять ДО любых редиректов на https и до прокси в Next.js,
    # иначе запрос уходит в приложение и отдаётся 404 — сертификат не выпустится.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    if ($host = www.pluson.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pluson.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pluson.ru www.pluson.ru;
    return 301 https://$host$request_uri;






}

server {
    # Проверка владения доменом для выпуска сертификата (acme.sh/certbot, webroot).
    # ⚠️ Должно стоять ДО любых редиректов на https и до прокси в Next.js,
    # иначе запрос уходит в приложение и отдаётся 404 — сертификат не выпустится.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    listen 443 ssl http2 default_server;
    server_name pluson.ru www.pluson.ru;
    ssl_certificate /etc/ssl/pluson-globalsign/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/ssl/pluson-globalsign/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling и resolver — общий сниппет (deploy/nginx-ssl-extra.conf).
    # Подключается ПОСЛЕ options-ssl-nginx.conf, иначе часть директив дублируется.
    include /etc/nginx/snippets/plusson-ssl-extra.conf;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Регистрация партнёров (миграция 105)
    location ~ ^/partner/[0-9]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Воронки выдачи лид-магнитов (бэк отдаёт 302 на t.me/<bot>?start=fnl_<run_id>)
    location ~ ^/(m|p)/[a-z0-9]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Веб-витрина события — ТА ЖЕ сборка Mini App (dist-web), обкатка на /w/.
    # Один код на все площадки: правка в mini-app/src/ едет и сюда, и в TG/VK/MAX.
    location /w/ {
        alias /var/www/plusson/mini-app/dist-web/;
        try_files $uri $uri/ /w/index.html;
    }
    location /event/assets/ {
        alias /var/www/plusson/mini-app/dist-web/assets/;
    }

    # Витрина события — сборка Mini App (dist-web): один код на все площадки.
    # ⚠️ Форма /event/{slug}/register остаётся на FastAPI (правило ниже): на неё
    # ведут ВК-бот, MAX-бот и рассылки, это отдельный серверный обработчик.
    location /event/ {
        alias /var/www/plusson/mini-app/dist-web/;
        try_files $uri $uri/ /event/index.html;
    }

    # Простая серверная HTML-страница события → FastAPI (GET /event/{slug})
    location ~ ^/event/[^/]+/(register|register-submit)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # МедиаЛифт — веб-кабинет участника (серверный HTML из FastAPI).
    location = /medialift/me {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Серверная HTML-страница «Все события клиента» → FastAPI (GET /o/{client_id})
    location ~ ^/o/[0-9]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Публичные турнирные страницы → FastAPI: сводная /t/{slug} (перечень номинаций),
    # таблица /t/{slug}/{stage_id} и регламент. Сводная нужна, когда номинаций 70 —
    # раздавать 70 отдельных ссылок невозможно.
    location ~ ^/t/[^/]+(/[0-9]+(/reglament)?)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── Вебинарная комната: WebSocket realtime (чат/реакции) → api :8000 ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── Вебинарная комната: HLS-плейлисты и сегменты от MediaMTX (:8888) ──
    # HLS cookieCheck-редирект MediaMTX ведёт на /live/... — проксируем в MediaMTX
    location /live/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        # cookieCheck (MediaMTX v1.19) — cookie и редирект живут на /live/, проксируем прозрачно
        proxy_pass_header Set-Cookie;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /hls/ {
        rewrite ^/hls/(.*)$ /live/$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /r/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /l/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/c/\d+/(tg|vk|max)(/|$) {
        rewrite ^/c/\d+/(.*)$ /$1 last;
    }

    # Хешированные ассеты mini-app: 404 для несуществующих (НЕ html-fallback),
    # чтобы старый закешированный index.html не подсовывал HTML вместо JS и не ломал WKWebView
    location /tg/assets/ {
        alias /var/www/plusson/mini-app/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html — никогда не кешировать, чтобы Telegram всегда видел свежий список ассетов
    location = /tg/ {
        alias /var/www/plusson/mini-app/dist/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /tg/ {
        alias /var/www/plusson/mini-app/dist/;
        try_files $uri $uri/ /tg/index.html;
        # ⚠️⚠️ index.html НЕ КЕШИРУЕМ И ЗДЕСЬ, а не только на голом /tg/
        # (10.09.2026). Запрет стоял лишь у `location = /tg/`, а страницы
        # вида /tg/event/{slug} — по ним и открывают Mini App из бота —
        # уходили с обычным etag. Webview держал СТАРЫЙ index.html и после
        # выкатки просил ассеты по старым именам с хешем → 404 → БЕЛЫЙ ЭКРАН.
        # Ловилось выборочно: iPhone успевал перечитать, Android держал кеш.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ⚠️⚠️ ТАКОЙ ЖЕ БЛОК, КАК У /tg/assets/ — БЕЗ НЕГО VK MINI APP «ТО ГРУЗИТСЯ,
    # ТО НЕТ» (2026-08-28). У Telegram блок был, у VK и MAX — нет, и запрос
    # несуществующего ассета попадал в общий `try_files … /vk/index.html`:
    # nginx отдавал HTML с кодом 200 вместо файла. Браузер пытался выполнить
    # его как JavaScript и падал — приложение не открывалось.
    # Случается после каждой выкатки: у сборки новые имена файлов с хешем, а
    # webview держит старый index.html и просит по старым именам.
    location /vk/assets/ {
        alias /var/www/plusson/mini-app/dist-vk/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /vk/ {
        alias /var/www/plusson/mini-app/dist-vk/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /vk/ {
        alias /var/www/plusson/mini-app/dist-vk/;
        try_files $uri $uri/ /vk/index.html;
        # ⚠️⚠️ index.html НЕ КЕШИРУЕМ И ЗДЕСЬ, а не только на голом /vk/
        # (10.09.2026). Запрет стоял лишь у `location = /vk/`, а страницы
        # вида /vk/event/{slug} — по ним и открывают Mini App из бота —
        # уходили с обычным etag. Webview держал СТАРЫЙ index.html и после
        # выкатки просил ассеты по старым именам с хешем → 404 → БЕЛЫЙ ЭКРАН.
        # Ловилось выборочно: iPhone успевал перечитать, Android держал кеш.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # MAX Mini App. В настройках бота MAX указывается адрес С НОМЕРОМ КЛИЕНТА
    # (https://pluson.ru/c/{id}/max/) — его переписывает location ~ ^/c/\d+/…
    # ⚠️ Блок assets обязателен по той же причине, что у /tg/ и /vk/: иначе
    # устаревший запрос получает HTML вместо JS и приложение не открывается.
    location /max/assets/ {
        alias /var/www/plusson/mini-app/dist-max/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /max/ {
        alias /var/www/plusson/mini-app/dist-max/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /max/ {
        alias /var/www/plusson/mini-app/dist-max/;
        try_files $uri $uri/ /max/index.html;
        # ⚠️⚠️ index.html НЕ КЕШИРУЕМ И ЗДЕСЬ, а не только на голом /max/
        # (10.09.2026). Запрет стоял лишь у `location = /max/`, а страницы
        # вида /max/event/{slug} — по ним и открывают Mini App из бота —
        # уходили с обычным etag. Webview держал СТАРЫЙ index.html и после
        # выкатки просил ассеты по старым именам с хешем → 404 → БЕЛЫЙ ЭКРАН.
        # Ловилось выборочно: iPhone успевал перечитать, Android держал кеш.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /app {
        alias /var/www/plusson/mini-app/dist;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }



}
