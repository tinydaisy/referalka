# Дополнения к TLS для каждого server-блока на 443.
#
# Ставится в /etc/nginx/snippets/plusson-ssl-extra.conf и подключается
# строкой `include /etc/nginx/snippets/plusson-ssl-extra.conf;` ПОСЛЕ
# `include /etc/letsencrypt/options-ssl-nginx.conf;`.
#
# ⚠️⚠️ OCSP STAPLING. Без него браузер сам идёт на сервер удостоверяющего
# центра (у нас GlobalSign) проверять, не отозван ли сертификат. Пока тот
# отвечает — страница ждёт, хотя наш сервер уже всё отдал. Из России до
# GlobalSign бывает медленно и с обрывами, и это выглядит как «сайт висит,
# грузится без стилей», причём вперемешку: у одного открылось, у другого нет.
# Со стаплингом подтверждение отдаём мы сами, вместе с сертификатом.
#
# ⚠️ `ssl_stapling_verify off` — осознанно. При `on` nginx требует полную
# цепочку доверия в `ssl_trusted_certificate` (с корнем), а у нас в
# fullchain.pem только сертификат и промежуточный. Проверка ответа OCSP при
# этом всё равно делается браузером — он сверяет подпись сам.
#
# ⚠️ `resolver` ОБЯЗАТЕЛЕН: без него nginx не умеет разрешить адрес OCSP-сервера
# и молча не отдаёт стаплинг (в логах ничего не будет). Берём публичные
# резолверы, а не системный — тот отдаёт закешированные ответы.
#
# ⚠️ `ssl_session_tickets` здесь НЕ трогаем: директива уже приходит из
# options-ssl-nginx.conf, а второе объявление в том же блоке роняет nginx
# («ssl_session_tickets directive is duplicate»). Возобновление сессий и так
# работает через `ssl_session_cache shared:le_nginx_SSL:10m` оттуда же.
#
# Проверка, что стаплинг реально включился (после пары запросов к сайту —
# nginx забирает ответ OCSP лениво, при первом обращении):
#   echo | openssl s_client -connect 127.0.0.1:443 -servername pluson.ru -status \
#     2>/dev/null | grep -E 'OCSP response|Cert Status'
#   → должно быть «Cert Status: good», а не «no response sent».

ssl_stapling on;
ssl_stapling_verify off;
resolver 8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout 5s;
