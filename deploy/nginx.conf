# nginx конфиг для PLUSSON API
# Расположение на сервере: /etc/nginx/sites-available/plusson
# После создания: ln -s /etc/nginx/sites-available/plusson /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.plusson.app;

    # После настройки SSL через certbot — эта секция заменится автоматически
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}
