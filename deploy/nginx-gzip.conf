# Сжатие ответов nginx. Уровень http.
#
# Ставится в /etc/nginx/conf.d/plusson-gzip.conf — оттуда nginx подхватывает
# файл сам (в nginx.conf есть `include /etc/nginx/conf.d/*.conf;`).
#
# ⚠️⚠️ ЗАЧЕМ ЭТО НУЖНО. Голая директива `gzip on;` (так стоит в стоковом
# nginx.conf Ubuntu) сжимает ТОЛЬКО `text/html` — это значение по умолчанию у
# `gzip_types`. Всё остальное уходит целиком. На проде из-за этого сборки
# Mini App, которые отдаёт сам nginx из /tg/ /vk/ /max/, ехали по 374–381 КБ
# вместо ~100 КБ: вчетверо больше трафика на телефоне, где канал и так узкий.
#
# ⚠️ Статику кабинета (/_next/) это НЕ затрагивало и раньше — её отдаёт сам
# Next.js через proxy_pass, а он сжимает самостоятельно. Поэтому проблему было
# не видно по кабинету: она проявлялась только там, где файл отдаёт nginx.
#
# ⚠️ `gzip_proxied any` обязателен: без него nginx не сжимает ответы, которые
# пришли от проксируемого приложения.
#
# ⚠️ Картинки (jpeg/png/webp) и видео в список НЕ добавлять — они уже сжаты
# своим форматом, повторное сжатие только жжёт процессор. `image/svg+xml` —
# исключение: это текст.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;
