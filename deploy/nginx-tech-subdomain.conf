# tech.pluson.ru — кабинет тех-специалистов (внедренцев), миграция 391.
#
# Ставится как /etc/nginx/sites-enabled/tech-pluson.
#
# ⚠️⚠️ ФАЙЛ ЖИВЁТ В РЕПОЗИТОРИИ, а не только на сервере. Правишь — правь здесь и
# копируй на сервер, а не наоборот: иначе при переезде конфиг некому вспомнить.
# На этом уже обжигались — в репозитории лежал огрызок на 748 байт против 11,8 КБ
# живого конфига, и переезд по нему был невозможен.
#
# ⚠️ Поддомен ведёт в ТО ЖЕ приложение Next.js на порту 3000, а не в отдельное.
# Кабинет внедренца — это раздел `/tech` того же сайта; своя копия приложения
# означала бы вторую сборку и вторую выкатку на каждую правку.
#
# ⚠️ Корень поддомена сразу уводит в /tech: человек набирает tech.pluson.ru и
# должен попасть в свой кабинет, а не на лендинг платформы.
#
# ⚠️ Сертификат ОТДЕЛЬНЫЙ (Let's Encrypt), потому что GlobalSign основного
# домена покрывает только pluson.ru и www — поддоменов в нём нет, и дописать их
# в готовый сертификат нельзя, он подписан целиком.
# Когда появится wildcard *.pluson.ru — здесь меняются ровно две строки путей.

server {
    listen 80;
    server_name tech.pluson.ru;

    # Проверка владения доменом. ⚠️ ДО редиректа на https, иначе запрос уйдёт в
    # приложение и отдаст 404 — сертификат не выпустится и не продлится.
    # ⚠️ БЕЗ try_files: с ним nginx складывал путь неверно и отдавал 404 —
    # проверка домена не проходила, сертификат не выпускался. Достаточно root.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    return 301 https://$host$request_uri;
}

server {
    # ⚠️ nginx 1.24: `listen 443 ssl http2` одной строкой. С 1.25.1 форма
    # объявлена устаревшей и пишется `http2 on;` отдельно — при обновлении ОС
    # поправить. Без http2 браузер открывает до 6 отдельных соединений на
    # страницу, и на слабом канале часть из них не устанавливается.
    listen 443 ssl http2;
    server_name tech.pluson.ru;

    ssl_certificate     /etc/letsencrypt/live/tech.pluson.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tech.pluson.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # OCSP stapling: иначе браузер сам идёт проверять отзыв сертификата и ждёт
    # ответа — из России это медленно и с обрывами.
    include /etc/nginx/snippets/plusson-ssl-extra.conf;

    client_max_body_size 100M;

    # ⚠️ БЕЗ try_files: с ним nginx складывал путь неверно и отдавал 404 —
    # проверка домена не проходила, сертификат не выпускался. Достаточно root.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Корень — сразу в кабинет. ⚠️ Именно redirect, а не rewrite: адресная
    # строка должна показывать /tech, иначе ссылки внутри кабинета (они все
    # абсолютные, вида /tech/accruals) уводили бы человека на корень.
    location = / {
        return 302 https://tech.pluson.ru/tech;
    }

    # API — в бэкенд. ⚠️ Нужен здесь же: кабинет ходит на /api/v1/tech/*, и
    # без этого блока запросы уходили бы в Next.js и отдавали 404.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Всё остальное — в Next.js. ⚠️ Тот же процесс, что обслуживает pluson.ru:
    # это один сайт, у поддомена лишь свой вход.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
