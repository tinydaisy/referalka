<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iViSiON: ПЛЮСОН</title>
  <!-- Брендированный splash прямо в HTML — виден пока браузер качает
       React-бандл (242 KB JS) и пока летит fetch /landing-redirect.
       Без этого пользователь видел БЕЛЫЙ экран до 7 секунд. -->
  <style>
    html, body {
      margin: 0; padding: 0;
      background: linear-gradient(45deg, #25455D, #0a1520);
      min-height: 100vh;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFCFA4;
    }
    #plusson-splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      padding: 24px 28px;
      box-sizing: border-box;
      background: linear-gradient(45deg, #25455D, #0a1520);
      text-align: center;
    }
    #plusson-splash .logo {
      width: 72px; height: auto; margin-bottom: 4px;
      opacity: 0.95;
    }
    #plusson-splash .brand {
      font-size: 24px; font-weight: 700; letter-spacing: 1px;
      color: #FFCFA4; text-transform: uppercase;
      max-width: 100%;
    }
    #plusson-splash .sub {
      font-size: 13px; line-height: 1.45;
      color: rgba(255,255,255,0.85);
      margin-top: -8px;
      max-width: 320px;
    }
    #plusson-splash .greeting {
      font-size: 16px; line-height: 1.4;
      color: #FFCFA4;
      font-weight: 600;
      margin-top: 12px;
      max-width: 340px;
      min-height: 22px;
    }
    #plusson-splash .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255, 207, 164, 0.25);
      border-top-color: #FFCFA4;
      border-radius: 50%;
      animation: plusson-spin 0.8s linear infinite;
    }
    @keyframes plusson-spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!--
    Bridge-скрипт: повторяет логику ivision-conf bot.html.
    Запускается ДО React, в контексте user gesture (открытие Mini App).
    Просит у бота разрешения писать в ЛС и сразу шлёт event_start —
    бэк отвечает приветственным сообщением. Без этого пользователь не
    становится подписчиком и приветствие не приходит.
  -->
  <script>
  (function () {
    var twa = window.Telegram && window.Telegram.WebApp;
    if (!twa) return;
    try { twa.ready(); } catch (e) {}

    var u  = (twa.initDataUnsafe && twa.initDataUnsafe.user) || null;
    var sp = (twa.initDataUnsafe && twa.initDataUnsafe.start_param) || '';
    if (!u) return;

    // Персональное приветствие в splash — пока грузится React-бандл
    // и/или летит fetch /landing-redirect, юзер видит «Привет, Имя!»
    // вместо обезличенного спиннера. Имя из Telegram-профиля.
    try {
      var g = document.getElementById('plusson-greeting');
      if (g) {
        var firstName = (u.first_name || '').trim();
        g.textContent = firstName
          ? 'Привет, ' + firstName + '! Загружаем ваш личный кабинет'
          : 'Загружаем ваш личный кабинет';
      }
    } catch (e) {}

    // Парсим startapp: ref_pg<slug>_pid<id>_src<utm>_cid<id>_reg
    var eventSlug = '', partnerId = '', utmSource = '', clientId = 0, regFlag = false;
    sp.split('_').forEach(function (p) {
      if (p.indexOf('pg')  === 0) eventSlug = p.slice(2);
      if (p.indexOf('pid') === 0) partnerId = p.slice(3);
      if (p.indexOf('src') === 0) utmSource = p.slice(3);
      if (p.indexOf('cid') === 0) clientId  = parseInt(p.slice(3), 10) || 0;
      if (p === 'reg')            regFlag   = true;
    });

    function fireStart() {
      try {
        fetch('/api/v1/event', {
          method: 'POST',
          keepalive: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id:    String(u.id || ''),
            event:      'event_start',
            first_name: u.first_name || '',
            last_name:  u.last_name  || '',
            username:   u.username   || '',
            partner_id: partnerId,
            event_slug: eventSlug,
            client_id:  clientId,
            platform:   'telegram'
          })
        });
      } catch (e) {}
    }

    // Ранний редирект на сторонний лендинг клиента (миграция 057).
    // Срабатывает ДО React-bundle: пока React грузится, запрос летит,
    // и при заполненном events.landing_url window сразу уходит на лендинг —
    // пользователь не видит наш встроенный лендинг-заглушку.
    // При флаге `_reg` (возврат с лендинга) — редирект НЕ делаем, нужно
    // прокрутить React и пометить is_registered=true.
    //
    // window.__redirectPending — флаг для синхронизации с App.tsx.
    // Пока флаг true, React не рендерит контент (видит LoadingScreen).
    // Когда fetch завершается — либо window.location.replace (Mini App
    // уплывает), либо флаг снимается и React продолжает обычный flow.
    if (eventSlug && !regFlag) {
      window.__redirectPending = true;
      // Safety: даже если бэк завис — через 3 сек разблокируем React.
      setTimeout(function () { window.__redirectPending = false; }, 3000);
    }
    function maybeRedirectToLanding() {
      if (!eventSlug || regFlag) return;
      try {
        var qs = '?tg_id=' + encodeURIComponent(String(u.id || ''));
        if (partnerId) qs += '&pid=' + encodeURIComponent(partnerId);
        if (utmSource) qs += '&utm_source=' + encodeURIComponent(utmSource);
        fetch('/api/v1/public/events/' + encodeURIComponent(eventSlug) + '/landing-redirect' + qs)
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (data && data.redirect_url) {
              window.location.replace(data.redirect_url);
              // Не снимаем флаг — webview уже уходит на лендинг клиента.
            } else {
              window.__redirectPending = false;
            }
          })
          .catch(function () { window.__redirectPending = false; });
      } catch (e) { window.__redirectPending = false; }
    }

    if (typeof twa.requestWriteAccess === 'function') {
      try {
        twa.requestWriteAccess(function () { fireStart(); maybeRedirectToLanding(); });
      } catch (e) { fireStart(); maybeRedirectToLanding(); }
    } else {
      fireStart();
      maybeRedirectToLanding();
    }
  })();
  </script>
</head>
<body>
  <!-- Splash виден сразу — без ожидания JS-бандла. React смонтируется в #root,
       но #plusson-splash перекрывает экран пока стоит флаг __redirectPending
       или пока React не сделает document.getElementById('plusson-splash').remove(). -->
  <div id="plusson-splash">
    <img class="logo" src="/logo.png" alt="" onerror="this.style.display='none'" />
    <div class="brand">iViSiON: ПЛЮСОН</div>
    <div class="sub">Платформа для организаторов и экспертов: управляйте событием от А до Я — спикеры, рассылки, рефералы в одном месте</div>
    <div class="greeting" id="plusson-greeting"></div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main-tg.tsx"></script>
</body>
</html>
